<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مصاريفي</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#12161A">
<style>
  :root{
    --bg: #12161A;
    --surface: #1B2027;
    --surface-2: #232A32;
    --text: #EDEAE2;
    --text-dim: #8C949E;
    --accent: #8FB39A;
    --accent-dim: #5E7A69;
    --danger: #C77B6B;
    --radius: 14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;
    min-height:100vh;
    padding-bottom:40px;
  }
  header{
    padding:28px 20px 18px;
    text-align:center;
    border-bottom:1px solid var(--surface-2);
  }
  header h1{margin:0;font-size:22px;letter-spacing:0.5px;font-weight:700;}
  header p{margin:6px 0 0;color:var(--text-dim);font-size:13px;}
  .wrap{max-width:480px;margin:0 auto;padding:20px;}
  .card{background:var(--surface);border-radius:var(--radius);padding:18px;margin-bottom:16px;}
  label{display:block;font-size:13px;color:var(--text-dim);margin-bottom:6px;}
  input[type=text], input[type=number], select{
    width:100%;padding:13px 14px;border-radius:10px;border:1px solid var(--surface-2);
    background:var(--surface-2);color:var(--text);font-size:16px;margin-bottom:14px;font-family:inherit;
  }
  input:focus, select:focus{outline:none;border-color:var(--accent-dim);}
  .kind-toggle, .type-toggle{display:flex;gap:8px;margin-bottom:14px;}
  .kind-toggle button, .type-toggle button{
    flex:1;padding:11px;border-radius:10px;border:1px solid var(--surface-2);
    background:var(--surface-2);color:var(--text-dim);font-size:14px;cursor:pointer;
  }
  .kind-toggle button.active{background:var(--accent);color:#12161A;border-color:var(--accent);font-weight:700;}
  .type-toggle button.active{background:var(--accent-dim);color:var(--text);border-color:var(--accent-dim);}
  .cat-guess{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--accent);margin:-6px 0 14px;min-height:18px;}
  button.submit{
    width:100%;padding:15px;border-radius:10px;border:none;background:var(--accent);
    color:#12161A;font-size:16px;font-weight:700;cursor:pointer;
  }
  button.submit:active{opacity:0.85;}
  button.submit:disabled{opacity:0.5;}
  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--surface-2);color:var(--text);padding:12px 20px;border-radius:10px;
    font-size:14px;opacity:0;transition:all 0.25s ease;pointer-events:none;
    border:1px solid var(--accent-dim);white-space:nowrap;z-index:60;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .recent{margin-top:4px;}
  .recent h2, .dash h2{font-size:13px;color:var(--text-dim);font-weight:600;margin:0 0 10px;}
  .row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--surface-2);font-size:14px;}
  .row:last-child{border-bottom:none;}
  .row .item{font-weight:600;}
  .row .cat{color:var(--text-dim);font-size:12px;}
  .row .amt{font-weight:700;color:var(--accent);}
  .row .amt.income{color:#8FC1E0;}
  .settings-btn{
    position:fixed;top:16px;left:16px;background:var(--surface);border:1px solid var(--surface-2);
    color:var(--text-dim);width:38px;height:38px;border-radius:50%;font-size:16px;cursor:pointer;z-index:40;
  }
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:none;align-items:center;justify-content:center;padding:20px;z-index:50;}
  .modal-overlay.show{display:flex;}
  .modal{background:var(--surface);border-radius:var(--radius);padding:20px;max-width:420px;width:100%;}
  .modal h3{margin-top:0;font-size:15px;}
  .modal p{color:var(--text-dim);font-size:12.5px;line-height:1.6;}
  .modal-actions{display:flex;gap:8px;margin-top:10px;}
  .modal-actions button{flex:1;padding:11px;border-radius:10px;border:none;font-size:14px;cursor:pointer;}
  .modal-actions .save{background:var(--accent);color:#12161A;font-weight:700;}
  .modal-actions .cancel{background:var(--surface-2);color:var(--text);}
  .sheet-link{display:block;text-align:center;color:var(--accent);font-size:13px;margin-top:14px;text-decoration:none;}
  .dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
  .dash-box{background:var(--surface-2);border-radius:10px;padding:12px;text-align:center;}
  .dash-box .label{font-size:11px;color:var(--text-dim);margin-bottom:4px;}
  .dash-box .value{font-size:17px;font-weight:700;}
  .dash-box.expenses .value{color:var(--danger);}
  .dash-box.income .value{color:#8FC1E0;}
  .dash-box.net .value{color:var(--accent);}
  .dash-top{font-size:13px;color:var(--text-dim);margin-bottom:8px;}
  .warn{
    background:rgba(199,123,107,0.15);border:1px solid var(--danger);color:var(--danger);
    padding:8px 10px;border-radius:8px;font-size:12.5px;margin-top:8px;
  }
  .refresh-btn{
    background:none;border:none;color:var(--text-dim);font-size:12px;cursor:pointer;
    text-decoration:underline;padding:0;margin-bottom:8px;
  }
</style>
</head>
<body>

<button class="settings-btn" onclick="openSettings()">⚙︎</button>

<header>
  <h1>مصاريفي</h1>
  <p>سجّل أي حاجة تشتريها في ثانية</p>
</header>

<div class="wrap">

  <div class="card dash" id="dashCard">
    <button class="refresh-btn" onclick="loadDashboard()">تحديث</button>
    <h2>ملخص الشهر ده</h2>
    <div class="dash-grid">
      <div class="dash-box expenses"><div class="label">مصروفات</div><div class="value" id="dashExpenses">--</div></div>
      <div class="dash-box income"><div class="label">دخل</div><div class="value" id="dashIncome">--</div></div>
      <div class="dash-box net" style="grid-column:span 2;"><div class="label">الصافي</div><div class="value" id="dashNet">--</div></div>
    </div>
    <div class="dash-top" id="dashTop"></div>
    <div id="dashWarnings"></div>
  </div>

  <div class="card">
    <div class="kind-toggle">
      <button type="button" id="kindExpense" class="active" onclick="setKind('expense')">مصروف</button>
      <button type="button" id="kindIncome" onclick="setKind('income')">دخل</button>
    </div>

    <div id="expenseFields">
      <label for="item">اسم الحاجة اللي اشتريتها</label>
      <input type="text" id="item" placeholder="مثلاً: كيلو لحمة، ازازة لبن..." autocomplete="off">

      <div class="cat-guess" id="catGuess"></div>

      <label for="category">البند</label>
      <select id="category"></select>

      <label>نوع المصروف</label>
      <div class="type-toggle">
        <button type="button" id="typeVariable" class="active" onclick="setType('متغير')">متغيّر</button>
        <button type="button" id="typeFixed" onclick="setType('ثابت')">ثابت</button>
      </div>
    </div>

    <div id="incomeFields" style="display:none;">
      <label for="source">مصدر الدخل</label>
      <input type="text" id="source" placeholder="مثلاً: مرتب، فريلانس مشروع كذا..." autocomplete="off">
    </div>

    <label for="amount">المبلغ (جنيه)</label>
    <input type="number" id="amount" placeholder="0" inputmode="decimal">

    <button class="submit" id="submitBtn" onclick="submitEntry()">إضافة</button>
  </div>

  <div class="card recent">
    <h2>آخر الحركات (على الجهاز ده)</h2>
    <div id="recentList"></div>
    <a class="sheet-link" id="sheetLink" href="#" target="_blank" style="display:none;">افتح الشيت ↗</a>
  </div>

</div>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="settingsModal">
  <div class="modal">
    <h3>الإعدادات</h3>
    <p>حط هنا رابط الـ Web App اللي هتاخده من Google Apps Script بعد الـ Deploy. الرابط ده بيتخزن على جهازك بس.</p>
    <input type="text" id="scriptUrlInput" placeholder="https://script.google.com/macros/s/.../exec">
    <p style="margin-top:16px;">رابط الشيت نفسه (اختياري، عشان تفتحه بسرعة من هنا)</p>
    <input type="text" id="sheetUrlInput" placeholder="https://docs.google.com/spreadsheets/d/...">
    <div class="modal-actions">
      <button class="cancel" onclick="closeSettings()">إلغاء</button>
      <button class="save" onclick="saveSettings()">حفظ</button>
    </div>
  </div>
</div>

<script>
const DEFAULT_CATEGORIES = ["لحوم","بقالة","خضار وفاكهة","مواصلات","فواتير","إيجار","ترفيه","صحة","تعليم","أخرى"];

const DEFAULT_KEYWORDS = {
  "لحمة":"لحوم","لحم":"لحوم","فراخ":"لحوم","فرخة":"لحوم","كفتة":"لحوم","كباب":"لحوم","سمك":"لحوم","بط":"لحوم",
  "لبن":"بقالة","جبنة":"بقالة","زبدة":"بقالة","زيت":"بقالة","رز":"بقالة","سكر":"بقالة","شاي":"بقالة","مكرونة":"بقالة","عيش":"بقالة","بيض":"بقالة",
  "خضار":"خضار وفاكهة","فاكهة":"خضار وفاكهة","طماطم":"خضار وفاكهة","بطاطس":"خضار وفاكهة","موز":"خضار وفاكهة","تفاح":"خضار وفاكهة",
  "بنزين":"مواصلات","تاكسي":"مواصلات","اوبر":"مواصلات","اوتوبيس":"مواصلات","مترو":"مواصلات",
  "كهرباء":"فواتير","غاز":"فواتير","مياه":"فواتير","نت":"فواتير","انترنت":"فواتير","موبايل":"فواتير",
  "ايجار":"إيجار","إيجار":"إيجار",
  "سينما":"ترفيه","مطعم":"ترفيه","كافيه":"ترفيه","قهوة":"ترفيه",
  "دوا":"صحة","دواء":"صحة","دكتور":"صحة","صيدلية":"صحة",
  "مدرسة":"تعليم","كتب":"تعليم","كورس":"تعليم"
};

function loadKeywords(){
  const stored = localStorage.getItem("keywords");
  return stored ? {...DEFAULT_KEYWORDS, ...JSON.parse(stored)} : {...DEFAULT_KEYWORDS};
}
function saveKeyword(word, category){
  const custom = JSON.parse(localStorage.getItem("keywords") || "{}");
  custom[word.trim()] = category;
  localStorage.setItem("keywords", JSON.stringify(custom));
}

let currentType = "متغير";
let currentKind = "expense";

function setType(t){
  currentType = t;
  document.getElementById("typeVariable").classList.toggle("active", t==="متغير");
  document.getElementById("typeFixed").classList.toggle("active", t==="ثابت");
}

function setKind(k){
  currentKind = k;
  document.getElementById("kindExpense").classList.toggle("active", k==="expense");
  document.getElementById("kindIncome").classList.toggle("active", k==="income");
  document.getElementById("expenseFields").style.display = k==="expense" ? "block" : "none";
  document.getElementById("incomeFields").style.display = k==="income" ? "block" : "none";
}

function populateCategories(){
  const select = document.getElementById("category");
  select.innerHTML = "";
  DEFAULT_CATEGORIES.forEach(c=>{
    const opt = document.createElement("option");
    opt.value = c; opt.textContent = c;
    select.appendChild(opt);
  });
}

function guessCategory(text){
  const keywords = loadKeywords();
  const clean = text.trim();
  if(!clean) return null;
  for(const word in keywords){
    if(clean.includes(word)) return keywords[word];
  }
  return null;
}

document.getElementById("item").addEventListener("input", (e)=>{
  const guess = guessCategory(e.target.value);
  const guessEl = document.getElementById("catGuess");
  if(guess){
    document.getElementById("category").value = guess;
    guessEl.textContent = "✓ اتحطت تلقائي في بند: " + guess;
  } else {
    guessEl.textContent = e.target.value.trim() ? "مش عارف البند، اختاره يدوي وهتفتكر المرة الجاية" : "";
  }
});

function getScriptUrl(){ return localStorage.getItem("scriptUrl") || ""; }
function getSheetUrl(){ return localStorage.getItem("sheetUrl") || ""; }

function openSettings(){
  document.getElementById("scriptUrlInput").value = getScriptUrl();
  document.getElementById("sheetUrlInput").value = getSheetUrl();
  document.getElementById("settingsModal").classList.add("show");
}
function closeSettings(){ document.getElementById("settingsModal").classList.remove("show"); }
function saveSettings(){
  localStorage.setItem("scriptUrl", document.getElementById("scriptUrlInput").value.trim());
  localStorage.setItem("sheetUrl", document.getElementById("sheetUrlInput").value.trim());
  closeSettings();
  renderSheetLink();
  showToast("اتحفظ ✓");
  loadDashboard();
}
function renderSheetLink(){
  const link = document.getElementById("sheetLink");
  const url = getSheetUrl();
  if(url){ link.href = url; link.style.display = "block"; }
  else{ link.style.display = "none"; }
}

function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 2200);
}

function getRecent(){ return JSON.parse(localStorage.getItem("recent") || "[]"); }
function renderRecent(){
  const list = getRecent();
  const el = document.getElementById("recentList");
  if(list.length === 0){
    el.innerHTML = '<div style="color:var(--text-dim);font-size:13px;">لسه مفيش حاجة متسجلة</div>';
    return;
  }
  el.innerHTML = list.slice(0,10).map(r => {
    if(r.kind === "income"){
      return `<div class="row"><div><div class="item">${r.source}</div><div class="cat">دخل</div></div><div class="amt income">+${r.amount} ج</div></div>`;
    }
    return `<div class="row"><div><div class="item">${r.item}</div><div class="cat">${r.category} · ${r.type}</div></div><div class="amt">-${r.amount} ج</div></div>`;
  }).join("");
}

async function loadDashboard(){
  const scriptUrl = getScriptUrl();
  if(!scriptUrl) return;
  try{
    const res = await fetch(scriptUrl);
    const data = await res.json();
    document.getElementById("dashExpenses").textContent = Math.round(data.totalExpenses) + " ج";
    document.getElementById("dashIncome").textContent = Math.round(data.totalIncome) + " ج";
    document.getElementById("dashNet").textContent = Math.round(data.net) + " ج";
    document.getElementById("dashTop").textContent = data.topCategory
      ? `أكتر بند صرفت فيه: ${data.topCategory} (${Math.round(data.topAmount)} ج)`
      : "لسه مفيش مصروفات الشهر ده";
    const warnEl = document.getElementById("dashWarnings");
    if(data.overBudget && data.overBudget.length){
      warnEl.innerHTML = data.overBudget.map(cat =>
        `<div class="warn">⚠ تجاوزت ميزانية "${cat}" الشهر ده</div>`
      ).join("");
    } else {
      warnEl.innerHTML = "";
    }
  }catch(err){
    // silent fail, dashboard just stays as "--"
  }
}

async function submitEntry(){
  const amount = document.getElementById("amount").value;
  const scriptUrl = getScriptUrl();

  if(!amount){
    showToast("اكتب المبلغ");
    return;
  }
  if(!scriptUrl){
    showToast("سجّل رابط الـ Apps Script الأول من ⚙︎");
    openSettings();
    return;
  }

  let payload;
  if(currentKind === "income"){
    const source = document.getElementById("source").value.trim();
    if(!source){ showToast("اكتب مصدر الدخل"); return; }
    payload = { kind:"income", source, amount, date: new Date().toISOString() };
  } else {
    const item = document.getElementById("item").value.trim();
    const category = document.getElementById("category").value;
    if(!item){ showToast("اكتب اسم الحاجة"); return; }

    const guess = guessCategory(item);
    if(guess !== category){
      const words = item.split(/\s+/).filter(w => w.length > 1);
      words.forEach(w => saveKeyword(w, category));
    }
    payload = { kind:"expense", item, amount, category, type: currentType, date: new Date().toISOString() };
  }

  const btn = document.getElementById("submitBtn");
  btn.disabled = true;
  btn.textContent = "بتتسجل...";

  try{
    await fetch(scriptUrl, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    });

    const recent = getRecent();
    recent.unshift(payload);
    localStorage.setItem("recent", JSON.stringify(recent.slice(0,30)));

    document.getElementById("item").value = "";
    document.getElementById("source").value = "";
    document.getElementById("amount").value = "";
    document.getElementById("catGuess").textContent = "";
    setType("متغير");
    renderRecent();
    showToast("اتسجلت ✓");
    loadDashboard();
  }catch(err){
    showToast("حصل خطأ، جرب تاني");
  }finally{
    btn.disabled = false;
    btn.textContent = "إضافة";
  }
}

populateCategories();
renderRecent();
renderSheetLink();
loadDashboard();
if(!getScriptUrl()){
  setTimeout(openSettings, 400);
}
</script>
</body>
</html>
